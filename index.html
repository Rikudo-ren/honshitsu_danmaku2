<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>✝本質✝ 耐久弾幕 — 非公式ファン制作プロトタイプ</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #wrap{height:100%;display:flex;align-items:center;justify-content:center;}
  #game{
    height:min(100vh, calc(100vw * 720 / 480));
    width:auto;aspect-ratio:480/720;
    image-rendering:pixelated;touch-action:none;background:#000;
    box-shadow:0 0 40px rgba(120,160,255,.08);
  }
  #fs{position:fixed;right:8px;bottom:8px;background:rgba(0,0,0,.45);color:#9ab;border:1px solid #345;
      font:12px sans-serif;padding:4px 8px;cursor:pointer;opacity:.6;}
  #fs:hover{opacity:1;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
</div>
<button id="fs" type="button">全画面 (F)</button>
<script src="game.js"></script>
</body>
</html>
